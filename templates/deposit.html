<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeForge | Deposit</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="logo">Code<span>Forge</span></div>
    <div class="nav-status">Banking Module</div>
</nav>

<main class="container">

    <div class="heading">
        <h1>Deposit Money</h1>
        <p>Perform a legitimate deposit through the CodeForge application.</p>
    </div>

    <div class="form-card">

        <form method="POST">

            <label for="account_id">Select Account</label>

            <select name="account_id" id="account_id" required>

                {% for account in accounts %}

                <option value="{{ account[0] }}">
                    #{{ account[0] }} - {{ account[1] }}
                    (₹{{ account[2] }})
                </option>

                {% endfor %}

            </select>


            <label for="amount">Deposit Amount</label>

            <input
                type="number"
                id="amount"
                name="amount"
                min="1"
                step="0.01"
                placeholder="Enter amount"
                required
            >


            <button type="submit" class="primary-button">
                Deposit Money
            </button>

        </form>

    </div>

    <div class="page-actions">
        <a href="/accounts" class="back-button">
            ← Back to Accounts
        </a>
    </div>

</main>

</body>
</html>
