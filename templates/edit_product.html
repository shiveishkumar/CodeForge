<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeForge | Update Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">
    <a href="{{ url_for('home') }}" class="logo">Code<span>Forge</span></a>
    <div class="nav-status">Inventory Module</div>
</nav>

<main class="container">

    <div class="heading">
        <h1>Update Product</h1>
        <p>Modify an inventory record through the CodeForge application.</p>
    </div>

    <div class="form-card">

        <form method="POST">

            <label>Product</label>

            <select name="product_id" required>

                {% for product in products %}

                <option value="{{ product[0] }}">
                    #{{ product[0] }} - {{ product[1] }}
                </option>

                {% endfor %}

            </select>


            <label>New Quantity</label>

            <input
                type="number"
                name="quantity"
                min="0"
                placeholder="Enter new quantity"
                required
            >


            <label>New Price</label>

            <input
                type="number"
                name="price"
                min="0"
                step="0.01"
                placeholder="Enter new price"
                required
            >


            <button type="submit" class="primary-button">
                Update Product
            </button>

        </form>

    </div>

    <div class="page-actions">

        <a href="/inventory" class="back-button">
            ← Back to Inventory
        </a>

    </div>

</main>

</body>
</html>
