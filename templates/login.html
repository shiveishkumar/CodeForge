
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeForge Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f14;
            color: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 360px;
            max-width: calc(100% - 32px);
            padding: 32px;
            border: 1px solid #27313d;
            border-radius: 16px;
            background: #121821;
            box-shadow: 0 20px 60px #0005;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        p {
            color: #9daec2;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            color: white;
            background: #0b0f14;
            border: 1px solid #394657;
            border-radius: 7px;
        }

        input:focus {
            outline: 2px solid #078dcc;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #078dcc;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #0678ad;
        }

        .message {
            margin-top: 12px;
            color: #ff8585;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>CodeForge</h1>
        <p>Sign in to the secure banking system.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Log In</button>
        </form>
    </main>
</body>
</html>
