<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - CodeForge</title>

    <script>
    const savedTheme =
        localStorage.getItem("codeforge-theme") || "dark";

    document.documentElement.setAttribute(
        "data-theme",
        savedTheme
    );
</script>
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/dashboard.css') }}"
>
</head>

<body>

<nav class="navbar">

    <a href="{{ url_for('home') }}" class="logo">
        Code<span>Forge</span>
    </a>

    <div class="nav-status">
        Inventory Module
    </div>

</nav>


<main class="container">

    <h1>Add Product</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}

            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}
    {% endwith %}


    <div class="form-card">

        <form method="POST">

            <label>Product Name</label>

            <input
                type="text"
                name="product_name"
                placeholder="Example: Logitech Wireless Mouse"
                required
            >


            <label>Quantity</label>

            <input
                type="number"
                name="quantity"
                min="0"
                placeholder="Example: 25"
                required
            >


            <label>Price</label>

            <input
                type="number"
                name="price"
                min="0"
                step="0.01"
                placeholder="Example: 1499.00"
                required
            >


            <button
                type="submit"
                class="primary-button"
            >
                Add Product
            </button>

        </form>

    </div>

</main>

</body>

</html>
