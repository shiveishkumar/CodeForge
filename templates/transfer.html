<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeForge | Transfer</title>

    <script>
    const savedTheme =
        localStorage.getItem("codeforge-theme") || "dark";

    document.documentElement.setAttribute(
        "data-theme",
        savedTheme
    );
</script>
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/dashboard.css') }}"
>
</head>

<body>

<nav class="navbar">
    <a href="{{ url_for('home') }}" class="logo">Code<span>Forge</span></a>
    <div class="nav-status">Banking Module</div>
</nav>

<main class="container">
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="message {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}
    <div class="heading">
        <h1>Transfer Money</h1>
        <p>Transfer funds between two CodeForge bank accounts.</p>
    </div>

    <div class="form-card">

        <form method="POST">

            <label for="from_account">From Account</label>

            <select name="from_account" id="from_account" required>
                {% for account in accounts %}
                <option value="{{ account[0] }}">
                    #{{ account[0] }} - {{ account[1] }}
                    (₹{{ account[2] }})
                </option>
                {% endfor %}
            </select>


            <label for="to_account">To Account</label>

            <select name="to_account" id="to_account" required>
                {% for account in accounts %}
                <option value="{{ account[0] }}">
                    #{{ account[0] }} - {{ account[1] }}
                    (₹{{ account[2] }})
                </option>
                {% endfor %}
            </select>


            <label for="amount">Transfer Amount</label>

            <input
                type="number"
                id="amount"
                name="amount"
                min="1"
                step="0.01"
                placeholder="Enter amount"
                required
            >


            <button type="submit" class="primary-button">
                Transfer Money
            </button>

        </form>

    </div>

    <div class="page-actions">
        <a href="/accounts" class="back-button">
            ← Back to Accounts
        </a>
    </div>

</main>

</body>
</html>
